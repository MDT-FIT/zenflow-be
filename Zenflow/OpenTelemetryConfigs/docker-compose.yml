version: "3.8"
services:
  zipkin:
    image: openzipkin/zipkin:2.23
    ports:
      - "9411:9411"    # Zipkin standard port

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"    # Prometheus UI

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"    # Grafana UI

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"    # Elasticsearch API

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"    # Kibana UI

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.19.0
    environment:
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - apm-server.ingest.enabled=true
    ports:
      - "8300:8200"    # Map host 8300 → container 8200 (APM UI)
      - "4318:4317"    # Map host 4318 → container 4317 (OTLP intake)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4319:4317"    # Map host 4319 → container 4317 (OTLP gRPC)
      - "55682:55681"  # OTLP HTTP
      - "8889:8888"    # Prometheus exporter
      - "9096:9095"    # Zipkin receiver

